version: '3.8'

services:
  backend:
    build: ./backend
    container_name: presensi_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app.db:/app/app.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: presensi_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
